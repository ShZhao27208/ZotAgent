name: Publish Zotero update feed
on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example v0.7.2)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: zotero-update-feed
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate feed from uploaded release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: node scripts/update-manifest.mjs "$RELEASE_TAG"
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update Zotero automatic update feed"
          git pull --rebase origin main
          git push origin HEAD:main
